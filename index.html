<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Voting System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  Secure Voting Portal | Online Election System
</div>

<!-- LOGIN -->
<div id="loginBox" class="card-box">
  <h2>🔐 Voter Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="loginError" class="error"></p>
</div>

<!-- VOTING -->
<div id="votingBox" style="display:none;">
  <h1>🗳️ Cast Your Vote</h1>

  <div class="card-container">
    <div class="card" onclick="selectCandidate('A', event)">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Rahul_Gandhi.png">
      <h3>Rahul Gandhi</h3>
    </div>

    <div class="card" onclick="selectCandidate('B', event)">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Narendra_Modi_2023.jpg">
      <h3>Narendra Modi</h3>
    </div>

    <div class="card" onclick="selectCandidate('C', event)">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Arvind_Kejriwal_2020.jpg">
      <h3>Arvind Kejriwal</h3>
    </div>
  </div>

  <button onclick="submitVote()">Submit Vote</button>

  <div class="result" id="resultBox" style="display:none;">
    <h3>Live Results</h3>
    <p>Rahul Gandhi: <span id="voteA">0</span></p>
    <p>Narendra Modi: <span id="voteB">0</span></p>
    <p>Arvind Kejriwal: <span id="voteC">0</span></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
